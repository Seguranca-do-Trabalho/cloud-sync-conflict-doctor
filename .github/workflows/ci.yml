# CI — Cloud Sync Conflict Doctor
# Standard: docs/test-strategy.md section 6 (single file, two jobs, no matrix).
# Triggers: push to main, pull_request. Cron disabled (bench smoke BENCH-01/02).
# Traits contract (docs/test-strategy.md section 1.1):
#   OS=Windows     -> Windows native tests (excluded from Linux job via filter)
#   Category=Determinism -> EXPLICIT determinism proof also on Linux (SPEC §20)

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # schedule:
  #   - cron: "0 5 * * *" # nightly: bench smoke

permissions:
  contents: read

jobs:
  linux:
    name: linux / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # NuGet cache by lockfile hash (packages.lock.json); while the csproj files
      # don't adopt RestorePackagesWithLockFile, the key degrades to runner.os.
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build (Release)
        run: dotnet build CloudSyncConflictDoctor.sln -c Release

      # Linux suite: everything except OS=Windows; XPlat coverage + named TRX.
      # CDD_DETERMINISM_DIR: where DET tests publish scanA/scanB/scanC.json
      # (contract defined in EPIC 13.2; may remain empty at this stage).
      - name: Test (Linux, filtro OS!=Windows)
        run: |
          mkdir -p determinism
          export CDD_DETERMINISM_DIR="$PWD/determinism"
          dotnet test tests/Doctor.Tests -c Release --no-build \
            --filter "OS!=Windows" \
            --collect:"XPlat Code Coverage" \
            -- RunSettings.RunSettingsPath=tests/Doctor.Tests/coverlet.runsettings \
            --logger "trx;LogFileName=linux.trx"

      # EXPLICIT determinism on Linux too (its own line in the PR summary).
      - name: Test (determinism, Category=Determinism)
        run: |
          export CDD_DETERMINISM_DIR="$PWD/determinism"
          mkdir -p determinism
          dotnet test tests/Doctor.Tests -c Release --no-build \
            --filter "Category=Determinism" \
            --logger "trx;LogFileName=linux-determinism.trx"

      # SHA-256 of A/B/C reports (fixed labels scanA/scanB/scanC.json,
      # sha256sum format "<hash>  <label>"). Tolerates missing JSON at this
      # stage; becomes mandatory once EPIC 13.2 merges.
      - name: Generate determinism-hashes.txt
        if: always()
        run: |
          : > determinism-hashes.txt
          if ls determinism/scan*.json >/dev/null 2>&1; then
            ( cd determinism && sha256sum scan*.json ) >> determinism-hashes.txt
          else
            echo "# no scanA/scanB/scanC.json at this stage (EPIC 13.2 contract not yet merged)" >> determinism-hashes.txt
          fi
          cat determinism-hashes.txt

      - name: Upload Linux results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-results
          path: |
            tests/**/TestResults/**
            **/coverage.cobertura.xml
            determinism-hashes.txt
          retention-days: 30

  windows:
    name: windows / test
    runs-on: windows-latest # job where native code runs (OS=Windows)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build (Release)
        run: dotnet build CloudSyncConflictDoctor.sln -c Release

      # FULL SUITE (no OS!=Windows filter), including native-windows.
      # Known limitation at this stage: native tests may fail on the
      # #if WINDOWS stub of the enumerator (T07). Do not disable or remove tests;
      # this job is the evidence of progress for the native EPIC.
      - name: Test (Windows, full suite)
        run: dotnet test tests/Doctor.Tests -c Release --no-build --collect:"XPlat Code Coverage" -- RunSettings.RunSettingsPath=tests/Doctor.Tests/coverlet.runsettings --logger "trx;LogFileName=windows.trx"

      - name: Upload Windows results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: |
            tests/**/TestResults/**
            **/coverage.cobertura.xml
          retention-days: 30
