# CI — Cloud Sync Conflict Doctor
# Norma: docs/test-strategy.md secao 6 (arquivo UNICO, dois jobs, sem matriz).
# Gatilhos: push em main, pull_request. Cron desativado (bench smoke BENCH-01/02).
# Contrato de traits (docs/test-strategy.md secao 1.1):
#   OS=Windows     -> testes nativos Windows (excluidos do job Linux via filtro)
#   Category=Determinism -> prova de determinismo EXPLICITa tambem no Linux (SPEC §20)

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # schedule:
  #   - cron: "0 5 * * *" # noturno: bench smoke

permissions:
  contents: read

jobs:
  linux:
    name: linux / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Cache NuGet por hash de lockfile (packages.lock.json); enquanto os csprojs
      # nao adotam RestorePackagesWithLockFile, a key degrada para runner.os.
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build (Release)
        run: dotnet build CloudSyncConflictDoctor.sln -c Release

      # Suite Linux: tudo exceto OS=Windows; cobertura XPlat + TRX nomeado.
      # CDD_DETERMINISM_DIR: onde os testes DET publicam scanA/scanB/scanC.json
      # (contrato definido no EPIC 13.2; nesta fase pode ficar vazio).
      - name: Test (Linux, filtro OS!=Windows)
        run: |
          mkdir -p determinism
          export CDD_DETERMINISM_DIR="$PWD/determinism"
          dotnet test tests/Doctor.Tests -c Release --no-build \
            --filter "OS!=Windows" \
            --collect:"XPlat Code Coverage" \
            -- RunSettings.RunSettingsPath=tests/Doctor.Tests/coverlet.runsettings \
            --logger "trx;LogFileName=linux.trx"

      # Determinismo EXPLICITO no Linux tambem (linha propria no resumo do PR).
      - name: Test (determinismo, Category=Determinism)
        run: |
          export CDD_DETERMINISM_DIR="$PWD/determinism"
          mkdir -p determinism
          dotnet test tests/Doctor.Tests -c Release --no-build \
            --filter "Category=Determinism" \
            --logger "trx;LogFileName=linux-determinism.trx"

      # SHA-256 dos relatorios A/B/C (rotulos fixos scanA/scanB/scanC.json,
      # formato sha256sum "<hash>  <rotulo>"). Tolera ausencia dos JSON nesta
      # fase; torna-se obrigatoria quando o EPIC 13.2 mergear.
      - name: Gerar determinism-hashes.txt
        if: always()
        run: |
          : > determinism-hashes.txt
          if ls determinism/scan*.json >/dev/null 2>&1; then
            ( cd determinism && sha256sum scan*.json ) >> determinism-hashes.txt
          else
            echo "# sem scanA/scanB/scanC.json nesta fase (contrato do EPIC 13.2 ainda nao mergeado)" >> determinism-hashes.txt
          fi
          cat determinism-hashes.txt

      - name: Upload resultados linux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-results
          path: |
            tests/**/TestResults/**
            **/coverage.cobertura.xml
            determinism-hashes.txt
          retention-days: 30

  windows:
    name: windows / test
    runs-on: windows-latest # job onde vive o nativo (OS=Windows)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build (Release)
        run: dotnet build CloudSyncConflictDoctor.sln -c Release

      # SUITE COMPLETA (sem filtro OS!=Windows), incluindo native-windows.
      # Limitacao conhecida desta fase: os testes nativos podem falhar sobre o
      # stub #if WINDOWS do enumerador (T07). Nao desativar nem remover testes;
      # o job e a evidencia de progresso do EPIC nativo.
      - name: Test (Windows, suíte completa)
        run: dotnet test tests/Doctor.Tests -c Release --no-build --collect:"XPlat Code Coverage" -- RunSettings.RunSettingsPath=tests/Doctor.Tests/coverlet.runsettings --logger "trx;LogFileName=windows.trx"

      - name: Upload resultados windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: |
            tests/**/TestResults/**
            **/coverage.cobertura.xml
          retention-days: 30
